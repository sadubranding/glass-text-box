<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Glass Text</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Inter,"Hind Siliguri","Noto Sans Bengali",sans-serif;padding:14px;max-width:720px;margin-inline:auto}
h1{font-size:20px;margin:6px 0 12px}
#bar{display:none;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:10px}
#bar.off{display:flex;background:#fff1f0;color:#b42318;border:1px solid #f5b5ae}
#bar.up{display:flex;background:#fff8e6;color:#8a5a00;border:1px solid #f0d28a}
button{font:inherit;cursor:pointer}
.btn{background:#111;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.alt{background:#fff;color:#111;border:1px solid #ccc}
#stage{border-radius:16px;min-height:220px;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;border:1px solid #e5e5e5;background:linear-gradient(135deg,#3b6a94,#7fb0d6)}
#stage.flower{background:radial-gradient(circle at 30% 40%,#ff7a45 0,transparent 35%),radial-gradient(circle at 60% 55%,#ffb347 0,transparent 30%),radial-gradient(circle at 75% 30%,#f7c6d8 0,transparent 25%),linear-gradient(135deg,#3b6a94,#7fb0d6)}
#stage.check{background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/20px 20px}
canvas{max-width:100%;height:auto}
label{display:block;font-size:13px;margin:12px 0 4px;color:#444}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid #ccc;border-radius:10px;background:#fff;color:#111}
input[type=range]{width:100%}
input[type=color]{width:44px;height:38px;border:1px solid #ccc;border-radius:8px;padding:2px;background:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid #ddd;padding:0}
.seg button{padding:7px 10px;border:1px solid #ccc;background:#fff;border-radius:8px;font-size:13px}
.seg button.on{background:#111;color:#fff;border-color:#111}
details{margin-top:16px;font-size:13px}
details input{margin:4px 0}
</style>
</head>
<body>
<h1>Liquid Glass Text</h1>
<div id="bar"></div>

<div id="stage" class="flower"><canvas id="cv"></canvas></div>

<label>প্রিভিউ ব্যাকগ্রাউন্ড</label>
<div class="row seg" id="bgSeg">
  <button data-bg="flower" class="on">রঙিন</button>
  <button data-bg="check">Transparent</button>
</div>

<label>লেখা (বাংলা / English)</label>
<input type="text" id="txt" placeholder="এখানে লিখুন...">

<label>লেখার রং</label>
<div class="row" id="sws"></div>
<div class="row" style="margin-top:6px"><input type="color" id="tc"><span style="font-size:13px;color:#666">নিজের পছন্দের রং</span></div>

<label>গ্লাসের রং (tint)</label>
<div class="row"><input type="color" id="gc"></div>

<label>গ্লাস স্বচ্ছতা: <span id="opv"></span></label>
<input type="range" id="op" min="10" max="100">

<label>লেখার সাইজ: <span id="szv"></span></label>
<input type="range" id="sz" min="24" max="140">

<div class="row" style="margin-top:12px">
  <label style="margin:0"><input type="checkbox" id="bold"> Bold</label>
</div>

<div class="row" style="margin-top:18px">
  <button class="btn" id="dl">PNG ডাউনলোড</button>
</div>

<details>
  <summary>GitHub সেটিং (progress save)</summary>
  <input type="text" id="ghRepo" placeholder="username/repo-name">
  <input type="text" id="ghTok" placeholder="GitHub token (repo permission)">
  <div class="row"><button class="btn alt" id="ghSave">Save সেটিং</button><button class="btn alt" id="ghLoad">GitHub থেকে লোড</button></div>
</details>

<script>
const FF='Inter,"Hind Siliguri","Noto Sans Bengali",sans-serif';
const DEF={text:'Liquid Glass',color:'#ffffff',tint:'#bfe3ff',opacity:60,size:64,bold:false};
const $=id=>document.getElementById(id);
let cfg=Object.assign({},DEF,JSON.parse(localStorage.getItem('lg_cfg')||'{}'));
let dirty=localStorage.getItem('lg_dirty')==='1';

const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};

function render(S){
  const fs=cfg.size,op=cfg.opacity/100,font=`${cfg.bold?600:400} ${fs}px ${FF}`;
  const m=document.createElement('canvas').getContext('2d');m.font=font;
  const txt=cfg.text||' ',tw=m.measureText(txt).width;
  const h=fs*2.1,w=Math.max(tw+fs*1.8,h),mg=24,W=w+mg*2,H=h+mg*2;
  const cv=document.createElement('canvas');cv.width=Math.ceil(W*S);cv.height=Math.ceil(H*S);
  const x=cv.getContext('2d');x.scale(S,S);
  const path=()=>{x.beginPath();x.roundRect(mg,mg,w,h,h/2)};
  // glass body
  let g=x.createLinearGradient(0,mg,0,mg+h);
  g.addColorStop(0,rgba('#ffffff',.38*op));g.addColorStop(.5,rgba(cfg.tint,.20*op));g.addColorStop(1,rgba(cfg.tint,.32*op));
  path();x.fillStyle=g;x.fill();
  x.save();path();x.clip();
  // inner edge glow (refraction feel)
  path();x.lineWidth=12;x.strokeStyle=rgba('#ffffff',.5*op+.1);x.shadowColor='rgba(255,255,255,.9)';x.shadowBlur=18*S;x.stroke();
  x.shadowBlur=0;x.shadowColor='transparent';
  // top specular
  g=x.createLinearGradient(0,mg,0,mg+h*.5);g.addColorStop(0,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(mg,mg,w,h*.5);
  // bottom reflection
  g=x.createLinearGradient(0,mg+h,0,mg+h*.65);g.addColorStop(0,rgba('#ffffff',.3));g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(mg,mg+h*.65,w,h*.35);
  x.restore();
  // rim
  g=x.createLinearGradient(mg,mg,mg+w,mg+h);
  g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.35,'rgba(255,255,255,.18)');g.addColorStop(.65,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(255,255,255,.85)');
  path();x.lineWidth=2.2;x.strokeStyle=g;x.stroke();
  // text
  x.font=font;x.textAlign='center';x.textBaseline='middle';
  x.shadowColor='rgba(0,0,0,.2)';x.shadowBlur=8*S;x.shadowOffsetY=2*S;
  x.fillStyle=cfg.color;x.fillText(txt,W/2,mg+h/2+fs*.04);
  return {cv,W,H};
}

function draw(){
  const {cv,W}=render(2);
  const p=$('cv');p.width=cv.width;p.height=cv.height;
  p.getContext('2d').drawImage(cv,0,0);
  p.style.width=(W)+'px';
}

function changed(){
  localStorage.setItem('lg_cfg',JSON.stringify(cfg));
  dirty=true;localStorage.setItem('lg_dirty','1');
  draw();bar();
}

function bar(){
  const b=$('bar');
  if(!navigator.onLine){b.className='off';b.textContent='⚠ Unsaved progress — অফলাইনে আছেন, নেট এলে GitHub এ upload করুন';return}
  if(dirty){
    b.className='up';b.innerHTML='<span>Unsaved progress</span>';
    const btn=document.createElement('button');btn.className='btn';btn.textContent='GitHub এ upload করুন';btn.onclick=ghPut;b.appendChild(btn);
  }else{b.className='';b.textContent=''}
}

const gh=()=>JSON.parse(localStorage.getItem('lg_gh')||'{}');
async function ghPut(){
  const g=gh();
  if(!g.repo||!g.token){alert('নিচে GitHub সেটিং এ repo আর token দিন');return}
  try{
    const url=`https://api.github.com/repos/${g.repo}/contents/liquidglass-progress.json`;
    const h={Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'};
    const r0=await fetch(url,{headers:h});let sha;if(r0.ok)sha=(await r0.json()).sha;
    const r=await fetch(url,{method:'PUT',headers:h,body:JSON.stringify({message:'Update progress',sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(cfg))))})});
    if(!r.ok)throw 0;
    dirty=false;localStorage.setItem('lg_dirty','0');bar();
  }catch(e){alert('Upload হয়নি। repo নাম আর token ঠিক আছে কিনা দেখুন')}
}
async function ghGet(){
  const g=gh();if(!g.repo||!g.token||!navigator.onLine)return;
  try{
    const r=await fetch(`https://api.github.com/repos/${g.repo}/contents/liquidglass-progress.json`,{headers:{Authorization:'Bearer '+g.token}});
    if(!r.ok)return;
    const j=await r.json();
    cfg=Object.assign({},DEF,JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))))));
    localStorage.setItem('lg_cfg',JSON.stringify(cfg));sync();draw();
  }catch(e){}
}

function sync(){
  $('txt').value=cfg.text;$('tc').value=cfg.color;$('gc').value=cfg.tint;
  $('op').value=cfg.opacity;$('sz').value=cfg.size;$('bold').checked=cfg.bold;
  $('opv').textContent=cfg.opacity+'%';$('szv').textContent=cfg.size;
}

['#ffffff','#111111','#ff5a36','#ffb020','#2ecc71','#22a7f0','#a259ff','#ff4d9d'].forEach(c=>{
  const b=document.createElement('button');b.className='sw';b.style.background=c;
  b.onclick=()=>{cfg.color=c;$('tc').value=c;changed()};$('sws').appendChild(b);
});
$('txt').oninput=e=>{cfg.text=e.target.value;changed()};
$('tc').oninput=e=>{cfg.color=e.target.value;changed()};
$('gc').oninput=e=>{cfg.tint=e.target.value;changed()};
$('op').oninput=e=>{cfg.opacity=+e.target.value;$('opv').textContent=cfg.opacity+'%';changed()};
$('sz').oninput=e=>{cfg.size=+e.target.value;$('szv').textContent=cfg.size;changed()};
$('bold').onchange=e=>{cfg.bold=e.target.checked;changed()};
document.querySelectorAll('#bgSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#bgSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  $('stage').className=b.dataset.bg;
});
$('dl').onclick=()=>{
  const {cv}=render(4);
  cv.toBlob(bl=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(bl);
    a.download='liquid-glass.png';document.body.appendChild(a);a.click();a.remove();
  },'image/png');
};
const g0=gh();$('ghRepo').value=g0.repo||'';$('ghTok').value=g0.token||'';
$('ghSave').onclick=()=>{localStorage.setItem('lg_gh',JSON.stringify({repo:$('ghRepo').value.trim(),token:$('ghTok').value.trim()}));alert('Saved')};
$('ghLoad').onclick=ghGet;
addEventListener('online',bar);addEventListener('offline',bar);

sync();draw();bar();
if(document.fonts)document.fonts.ready.then(draw);
</script>
</body>
</html>
